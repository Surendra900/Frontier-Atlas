name: Cloudflare PR Preview (Manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to test'
        required: true
        type: string

jobs:
  build-and-preview:
    name: Build & Deploy Pages Preview
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        working-directory: ./frontend
        env:
          # The left side is the variable Cloudflare expects.
          # The right side is your custom GitHub Secret name.
          CLOUDFLARE_API_TOKEN: ${{ secrets.FRONTIER_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FRONTIER_CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .vercel/output/static --project-name=frontieratlas --branch=pr-${{ inputs.pr_number }}